name: Private PDF archive integration test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/src/githubArchive.ts'
      - 'worker/test/githubArchive.test.ts'
      - '.github/workflows/archive-integration.yml'
permissions:
  contents: read
jobs:
  archive-test:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_TOKEN: ${{ secrets.MONSTAGE_ARCHIVE_GITHUB_TOKEN }}
    steps:
      - name: Check token and diagnose repository access
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          if not os.getenv("ARCHIVE_TOKEN"):
              raise SystemExit("ARCHIVE_TOKEN_MISSING: configure MONSTAGE_ARCHIVE_GITHUB_TOKEN")
          url = "https://api.github.com/repos/denoskume/Candidatures_Stages"
          req = urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["ARCHIVE_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28","User-Agent":"MonStage-Archive-Diagnostic"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  details=json.load(response)
                  print("REPOSITORY_READ_OK private="+str(details.get("private")))
          except urllib.error.HTTPError as error:
              body=error.read().decode(errors="replace")
              try: message=json.loads(body).get("message","unknown")
              except ValueError: message="unknown"
              raise SystemExit(f"REPOSITORY_ACCESS_FAILED HTTP {error.code}: {message}")
          PY
      - name: Write, read and clean up a synthetic PDF
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error, uuid, time
          path="Stage_2027/01_En_preparation/CI_TEST_"+uuid.uuid4().hex+".pdf"
          url="https://api.github.com/repos/denoskume/Candidatures_Stages/contents/"+path
          headers={"Authorization":"Bearer "+os.environ["ARCHIVE_TOKEN"],"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28","User-Agent":"MonStage-Archive-Diagnostic",
                   "Content-Type":"application/json"}
          def call(method,payload=None):
              req=urllib.request.Request(url,method=method,headers=headers,
                  data=json.dumps(payload).encode() if payload else None)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=40) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      raw=error.read().decode(errors="replace")
                      try: message=json.loads(raw).get("message","unknown")
                      except ValueError: message="unknown"
                      remaining=error.headers.get("X-RateLimit-Remaining","unknown")
                      retry_after=error.headers.get("Retry-After")
                      if attempt<2 and error.code in (429,500,502,503,504):
                          time.sleep(3*(attempt+1));continue
                      raise RuntimeError(f"{method} failed: HTTP {error.code}; {message}; rate-limit-remaining={remaining}; retry-after={retry_after}")
          pdf=b"%PDF-1.4\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n2 0 obj << /Type /Pages /Count 0 /Kids [] >> endobj\ntrailer << /Root 1 0 R >>\n%%EOF\n"
          sha=None
          try:
              saved=call("PUT",{"message":"Synthetic archive PDF test","content":base64.b64encode(pdf).decode(),"branch":"main"})
              sha=saved["content"]["sha"]
              current=call("GET")
              assert current["sha"]==sha,"PDF readback differs"
              print("PDF_WRITE_READ_OK")
          finally:
              if sha:
                  call("DELETE",{"message":"Clean synthetic PDF test","sha":sha,"branch":"main"})
                  print("PDF_CLEANUP_OK")
          PY
