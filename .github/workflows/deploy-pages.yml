name: Deploy MonStage to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monstage-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 398882157701-3brttf6bps0ual14rfoh81qnu8d6ceq9.apps.googleusercontent.com
      VITE_MONSTAGE_API_URL: https://monstage-auth-gateway.denoskume.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public auth configuration
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "VITE_GOOGLE_CLIENT_ID is not configured"; exit 1; }
          test -n "$VITE_MONSTAGE_API_URL" || { echo "VITE_MONSTAGE_API_URL is not configured"; exit 1; }
          case "$VITE_MONSTAGE_API_URL" in
            https://script.google.com/*|https://script.googleusercontent.com/*)
              echo "VITE_MONSTAGE_API_URL must point to the Cloudflare Worker, not Apps Script"
              exit 1
              ;;
          esac
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Worker tests
        run: npm run test:worker
      - name: Worker typecheck
        run: npm run typecheck:worker
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Scan production bundle for protected values
        run: |
          if grep -R "script.google.com/macros/s/" dist; then
            echo "Apps Script URL found in production bundle"
            exit 1
          fi
          if grep -R "@gmail.com" dist; then
            echo "Personal email found in production bundle"
            exit 1
          fi
          if grep -R "MONSTAGE_GATEWAY_SECRET" dist; then
            echo "Gateway secret identifier found in production bundle"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist



  browser-e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Responsive E2E tests
        run: npm run test:e2e


  deploy-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, deploy-apps-script]
    env:
      VITE_MONSTAGE_API_URL: https://monstage-auth-gateway.denoskume.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_GATEWAY_SECRET: ${{ secrets.APPS_SCRIPT_GATEWAY_SECRET }}
      GITHUB_ARCHIVE_TOKEN: ${{ secrets.MONSTAGE_ARCHIVE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare deployment credentials
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_GATEWAY_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare backend credentials incomplete; Worker deployment skipped."
          fi
      - name: Smoke test production auth gateway
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          status="$(curl -sS --retry 5 --retry-all-errors --max-time 20 -o /tmp/monstage-session.json -w '%{http_code}' "$VITE_MONSTAGE_API_URL/api/session")"
          test "$status" = "401" || { echo "Expected unauthenticated gateway status 401, got $status"; cat /tmp/monstage-session.json; exit 1; }
          if grep -q '"offers"' /tmp/monstage-session.json; then
            echo "Unauthenticated gateway response exposed offers"
            exit 1
          fi
      - name: Probe public ATS feeds
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          def get(name, url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode())
                  print(name, "HTTP", r.status)
                  print(name, json.dumps(body, ensure_ascii=False)[:1200])
              except Exception as e:
                  print(name, "ERROR", repr(e))

          def post(name,url,payload):
              req=urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Mozilla/5.0"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode())
                  print(name, "HTTP", r.status, "total=", body.get("total"), "batch=", len(body.get("jobPostings") or []))
                  print(name, json.dumps((body.get("jobPostings") or [])[:3], ensure_ascii=False)[:1800])
              except Exception as e:
                  print(name, "ERROR", repr(e))

          post("WORKDAY_AIRBUS","https://ag.wd3.myworkdayjobs.com/wday/cxs/ag/Airbus/jobs",{
              "appliedFacets":{},"limit":20,"offset":0,"searchText":"stage"
          })
          get("ASHBY_MISTRAL","https://api.ashbyhq.com/posting-api/job-board/mistral.ai?includeCompensation=true")
          get("GREENHOUSE_SHIFT","https://boards-api.greenhouse.io/v1/boards/shifttechnology/jobs?content=true")
          get("SMART_SOPRA","https://api.smartrecruiters.com/v1/companies/SopraSteria1/postings?limit=10&offset=0&country=fr")
          PY

      - name: Install Worker dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm --prefix worker install --no-audit --no-fund
      - name: Deploy Cloudflare Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          for attempt in 1 2 3; do
            npm --prefix worker run deploy && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 5))
          done
      - name: Configure private GitHub document archive
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          if [ -n "$GITHUB_ARCHIVE_TOKEN" ]; then
            printf '%s' "$GITHUB_ARCHIVE_TOKEN" | npx wrangler secret put GITHUB_ARCHIVE_TOKEN --config worker/wrangler.toml
            echo "Private GitHub archive token configured in Cloudflare Worker."
          else
            echo "::warning::MONSTAGE_ARCHIVE_GITHUB_TOKEN is not configured; private PDF archiving will remain disabled."
          fi
      - name: Verify private GitHub archive write and cleanup
        if: steps.cloudflare.outputs.configured == 'true' && env.GITHUB_ARCHIVE_TOKEN != ''
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error, uuid
          token = os.environ["GITHUB_ARCHIVE_TOKEN"]
          path = "Stage_2027/01_En_preparation/CI_TEST_" + uuid.uuid4().hex + ".pdf"
          url = "https://api.github.com/repos/denoskume/Candidatures_Stages/contents/" + path
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "MonStage-Archive-Test"}
          def call(method, payload=None):
              req = urllib.request.Request(url, method=method, headers={**headers, "Content-Type":"application/json"},
                  data=json.dumps(payload).encode() if payload is not None else None)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read())
          created = False
          try:
              result = call("PUT", {"message":"MonStage private archive smoke test", "content":base64.b64encode(b"%PDF-1.4\\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\\n2 0 obj << /Type /Pages /Count 0 /Kids [] >> endobj\\ntrailer << /Root 1 0 R >>\\n%%EOF\\n").decode(), "branch":"main"})
              sha = result["content"]["sha"]
              created = True
              actual = call("GET")
              if actual.get("sha") != sha: raise RuntimeError("Private GitHub archive readback mismatch")
              print("PRIVATE_GITHUB_ARCHIVE_WRITE_READ_OK")
          finally:
              if created:
                  call("DELETE", {"message":"Clean up MonStage archive smoke test", "sha":sha, "branch":"main"})
                  print("PRIVATE_GITHUB_ARCHIVE_CLEANUP_OK")
          PY
      - name: Force and diagnose external source sync
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import json, os, urllib.request

          payload = json.dumps({
              "gatewaySecret": os.environ["APPS_SCRIPT_GATEWAY_SECRET"],
              "action": "syncExternalSources",
          }).encode()

          request = urllib.request.Request(
              os.environ["APPS_SCRIPT_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=300) as response:
              body = json.loads(response.read().decode())

          print("External sync diagnostics:")
          print(json.dumps(body.get("sync", {}), sort_keys=True))

          failures = {
              name: details.get("error")
              for name, details in (body.get("sync") or {}).items()
              if isinstance(details, dict) and details.get("error")
          }
          if failures:
              print("Native Apps Script ATS warning:", json.dumps(failures, sort_keys=True))
          expected = ["lever", "greenhouse", "ashby", "smartRecruiters", "workday"]
          counts = {key: (body.get("sync") or {}).get(key, {}).get("count", 0) for key in expected}
          print("Native ATS counts:", counts)
          if not any(counts.values()):
              print("Native ATS yielded zero; verifying alternate CI runner ingestion next.")
          PY
      - name: Ingest official ATS listings from GitHub runner
        if: steps.cloudflare.outputs.configured == 'true'
        run: python scripts/ingest_public_ats.py

      - name: Smoke test Apps Script offers backend
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          payload = json.dumps({
              "gatewaySecret": os.environ["APPS_SCRIPT_GATEWAY_SECRET"],
              "action": "offers",
          }).encode()

          last_error = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      os.environ["APPS_SCRIPT_URL"],
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = json.loads(response.read().decode())

                  if body.get("source") != "Stage Intelligence France":
                      raise RuntimeError("Apps Script backend returned an unexpected source")
                  if not isinstance(body.get("offers"), list):
                      raise RuntimeError("Apps Script backend did not return an offers array")
                  if not isinstance(body.get("generatedAt"), str):
                      raise RuntimeError("Apps Script backend did not return generatedAt")

                  diagnostics = body.get("sourceDiagnostics") or {}
                  print(f"Apps Script offers backend is healthy on attempt {attempt}")
                  print(f"Offers total: {len(body['offers'])}")
                  print("Source counts: " + json.dumps({
                      "lever": diagnostics.get("lever", 0),
                      "greenhouse": diagnostics.get("greenhouse", 0),
                      "ashby": diagnostics.get("ashby", 0),
                      "smartRecruiters": diagnostics.get("smartRecruiters", 0),
                      "workday": diagnostics.get("workday", 0),
                  }, sort_keys=True))
                  break
              except (TimeoutError, urllib.error.URLError, urllib.error.HTTPError, RuntimeError, json.JSONDecodeError) as error:
                  last_error = error
                  print(f"Smoke test attempt {attempt}/3 failed: {error}")
                  if attempt < 3:
                      time.sleep(attempt * 5)
          else:
              raise SystemExit(f"Apps Script backend smoke test failed after 3 attempts: {last_error}")
          PY




  deploy-apps-script:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    env:
      APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Apps Script deployment credentials
        id: clasp
        run: |
          if [ -n "$APPS_SCRIPT_SCRIPT_ID" ] && [ -n "$CLASPRC_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apps Script credentials unavailable; backend deployment skipped. Frontend can deploy separately."
          fi
      - name: Deploy Apps Script
        if: steps.clasp.outputs.configured == 'true'
        working-directory: apps-script
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_SCRIPT_ID" > .clasp.json

          npx --yes @google/clasp@latest push --force

          deployment_id="$(printf '%s' "$APPS_SCRIPT_URL" | sed -n 's#.*\/s\/\([^/]*\)\/exec.*#\1#p')"
          test -n "$deployment_id" || { echo "::error::Unable to extract Apps Script deployment ID from APPS_SCRIPT_URL"; exit 1; }

          npx --yes @google/clasp@latest create-deployment \
            --deploymentId "$deployment_id" \
            --description "GitHub Actions $GITHUB_SHA"

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          reporting_interval: 5000
