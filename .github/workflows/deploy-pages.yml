name: Deploy MonStage to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: 398882157701-3brttf6bps0ual14rfoh81qnu8d6ceq9.apps.googleusercontent.com
      VITE_MONSTAGE_API_URL: https://monstage-auth-gateway.denoskume.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public auth configuration
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "VITE_GOOGLE_CLIENT_ID is not configured"; exit 1; }
          test -n "$VITE_MONSTAGE_API_URL" || { echo "VITE_MONSTAGE_API_URL is not configured"; exit 1; }
          case "$VITE_MONSTAGE_API_URL" in
            https://script.google.com/*|https://script.googleusercontent.com/*)
              echo "VITE_MONSTAGE_API_URL must point to the Cloudflare Worker, not Apps Script"
              exit 1
              ;;
          esac
      - name: Smoke test production auth gateway
        run: |
          status="$(curl -sS --retry 5 --retry-all-errors --max-time 20 -o /tmp/monstage-session.json -w '%{http_code}' "$VITE_MONSTAGE_API_URL/api/session")"
          test "$status" = "401" || { echo "Expected unauthenticated gateway status 401, got $status"; cat /tmp/monstage-session.json; exit 1; }
          if grep -q '"offers"' /tmp/monstage-session.json; then
            echo "Unauthenticated gateway response exposed offers"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Worker tests
        run: npm run test:worker
      - name: Worker typecheck
        run: npm run typecheck:worker
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Scan production bundle for protected values
        run: |
          if grep -R "script.google.com/macros/s/" dist; then
            echo "Apps Script URL found in production bundle"
            exit 1
          fi
          if grep -R "@gmail.com" dist; then
            echo "Personal email found in production bundle"
            exit 1
          fi
          if grep -R "MONSTAGE_GATEWAY_SECRET" dist; then
            echo "Gateway secret identifier found in production bundle"
            exit 1
          fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive E2E tests
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist


  deploy-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_GATEWAY_SECRET: ${{ secrets.APPS_SCRIPT_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare deployment credentials
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$APPS_SCRIPT_URL" ] && [ -n "$APPS_SCRIPT_GATEWAY_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare backend bindings are incomplete. Required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APPS_SCRIPT_URL, APPS_SCRIPT_GATEWAY_SECRET."
            exit 1
          fi
      - name: Install Worker dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm --prefix worker install --no-audit --no-fund
      - name: Deploy Cloudflare Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm --prefix worker run deploy
      - name: Restore Worker backend secrets
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: worker
        run: |
          printf '%s' "$APPS_SCRIPT_URL" | npx wrangler secret put APPS_SCRIPT_URL
          printf '%s' "$APPS_SCRIPT_GATEWAY_SECRET" | npx wrangler secret put APPS_SCRIPT_GATEWAY_SECRET
          npx wrangler secret list | grep -q '"APPS_SCRIPT_URL"'
          npx wrangler secret list | grep -q '"APPS_SCRIPT_GATEWAY_SECRET"'


  deploy-apps-script:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    env:
      APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Apps Script deployment credentials
        id: clasp
        run: |
          if [ -n "$APPS_SCRIPT_SCRIPT_ID" ] && [ -n "$CLASPRC_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apps Script deployment secrets are not configured; clasp deployment skipped."
          fi
      - name: Deploy Apps Script
        if: steps.clasp.outputs.configured == 'true'
        working-directory: apps-script
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_SCRIPT_ID" > .clasp.json
          npx --yes @google/clasp@latest push --force

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
