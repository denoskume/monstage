name: Deploy MonStage to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_MONSTAGE_API_URL: ${{ vars.VITE_MONSTAGE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public auth configuration
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "VITE_GOOGLE_CLIENT_ID is not configured"; exit 1; }
          test -n "$VITE_MONSTAGE_API_URL" || { echo "VITE_MONSTAGE_API_URL is not configured"; exit 1; }
          case "$VITE_MONSTAGE_API_URL" in
            https://script.google.com/*|https://script.googleusercontent.com/*)
              echo "VITE_MONSTAGE_API_URL must point to the Cloudflare Worker, not Apps Script"
              exit 1
              ;;
          esac
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-audit --no-fund
      - name: Worker tests
        run: npm run test:worker
      - name: Worker typecheck
        run: npm run typecheck:worker
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Scan production bundle for protected values
        run: |
          if grep -R "script.google.com/macros/s/" dist; then
            echo "Apps Script URL found in production bundle"
            exit 1
          fi
          if grep -R "@gmail.com" dist; then
            echo "Personal email found in production bundle"
            exit 1
          fi
          if grep -R "MONSTAGE_GATEWAY_SECRET" dist; then
            echo "Gateway secret identifier found in production bundle"
            exit 1
          fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive E2E tests
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
