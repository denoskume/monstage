name: Refresh MonStage internship sources

on:
  push:
    paths:
      - '.github/workflows/sync-ats.yml'
      - 'scripts/audit_target_careers.py'
      - 'scripts/discover_official_jobs.py'
      - 'scripts/discover_additional_workday.py'
      - 'scripts/discover_successfactors.py'
      - 'scripts/ingest_successfactors.py'
      - 'scripts/remaining_official_sources.json'
      - 'scripts/ingest_remaining_official.py'
      - 'scripts/test_remaining_official.py'
      - 'scripts/test_successfactors_verified.py'
      - 'scripts/report_ats_health.py'
      - 'scripts/test_report_ats_health.py'
      - 'scripts/test_discover_official_jobs.py'
      - 'scripts/ingest_public_ats.py'
      - 'scripts/test_ingest_public_ats.py'
      - 'scripts/test_apps_script_runner.cjs'
      - 'scripts/target_career_sources.json'
      - 'apps-script/Code.gs'
  workflow_run:
    # Import only after the UI/backend deployment workflow has completed.
    # The prior push-triggered import raced against clasp and lost the first
    # official offers as "Unknown authorized ATS source".
    workflows: ['Deploy MonStage to GitHub Pages']
    types: [completed]
    branches: [main]
  schedule:
    # Hourly, 24/7. Scheduled GitHub runners can start late.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monstage-ats-refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test official-source discovery and ATS ingestion safety
        run: |
          python -m unittest discover -s scripts -p 'test_discover_official_jobs.py' -v
          python -m unittest discover -s scripts -p 'test_ingest_public_ats.py' -v
          python -m unittest discover -s scripts -p 'test_successfactors_verified.py' -v
          python -m unittest discover -s scripts -p 'test_remaining_official.py' -v
          python -m unittest discover -s scripts -p 'test_report_ats_health.py' -v
          cp apps-script/Code.gs /tmp/monstage-apps-script-check.js
          node --check /tmp/monstage-apps-script-check.js
          node scripts/test_apps_script_runner.cjs

  refresh:
    # Never write into the production Sheets from an unmerged feature branch.
    # Push runs validate code only. Scheduled/manual runs, or a completed
    # successful deployment, can write to production after credentials exist.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_GATEWAY_SECRET: ${{ secrets.APPS_SCRIPT_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate official-source adapters
        run: python -m unittest discover -s scripts -p 'test_discover_official_jobs.py' -v
      - name: Audit all 30 employer career portals and public job sources
        id: audit
        continue-on-error: true
        run: python scripts/audit_target_careers.py
      - name: Discover SuccessFactors employer job pages (read-only)
        id: successfactors
        continue-on-error: true
        run: python scripts/discover_successfactors.py
      - name: Validate and ingest individual SuccessFactors employer pages
        id: official_pages
        continue-on-error: true
        run: python scripts/ingest_successfactors.py
      - name: Validate and ingest employer-hosted listings for the remaining 13 target groups
        id: remaining_official
        continue-on-error: true
        run: python scripts/ingest_remaining_official.py
      - name: Discover additional verified Workday tenants (read-only pending gateway authorization)
        id: additional_workday
        continue-on-error: true
        run: python scripts/discover_additional_workday.py
      - name: Ingest Workday and Veolia SmartRecruiters jobs through runner
        id: ingest
        continue-on-error: true
        run: python scripts/ingest_public_ats.py
      - name: Verify ATS offers persisted without triggering a destructive second sync
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = os.getenv("APPS_SCRIPT_URL")
          secret = os.getenv("APPS_SCRIPT_GATEWAY_SECRET")
          if not endpoint or not secret:
              raise SystemExit("Missing Apps Script URL or gateway secret")
          data = json.dumps({
              "gatewaySecret": secret,
              "action": "offers",
          }).encode("utf-8")
          req = urllib.request.Request(endpoint, data, {
              "Content-Type": "application/json",
              "Accept": "application/json",
          }, method="POST")
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = json.load(response)
          if payload.get("source") != "Stage Intelligence France" or not isinstance(payload.get("offers"), list):
              raise SystemExit("Backend did not return the expected persisted offers")
          rows = payload["offers"]
          counts = {
              prefix: sum(str(row.get("id", "")).lower().startswith(prefix + ":") for row in rows)
              for prefix in ("workday", "smartrecruiters", "greenhouse", "ashby", "lever")
          }
          print("Persisted official ATS listings by provider:", json.dumps(counts))
          print("Total stored offers, including historical records:", len(rows))
          if counts["workday"] == 0 and counts["smartrecruiters"] == 0:
              raise SystemExit("ATS ingestion appears empty: no Workday or SmartRecruiters listings persisted")
          print("Backend read verified; no second provider refresh was run.")
          PY

      - name: Report evidence-based ATS coverage and persisted offers for all 30 companies
        id: health
        if: always()
        continue-on-error: true
        run: python scripts/report_ats_health.py
      - name: Publish per-company A/B coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-career-coverage-${{ github.run_number }}
          path: |
            artifacts/career-source-coverage.json
            artifacts/career-official-leads.json
            artifacts/career-additional-workday-leads.json
            artifacts/career-successfactors-leads.json
            artifacts/career-verified-official-jobs.json
            artifacts/career-remaining-13-verified.json
            artifacts/career-source-coverage.md
            artifacts/career-jobboard-leads.json
            artifacts/ats-health-30.json
            artifacts/ats-health-30.md
          retention-days: 14
          if-no-files-found: warn

      - name: Fail visibly if source audit or ATS runner failed
        if: ${{ steps.audit.outcome == 'failure' || steps.additional_workday.outcome == 'failure' || steps.successfactors.outcome == 'failure' || steps.official_pages.outcome == 'failure' || steps.remaining_official.outcome == 'failure' || steps.health.outcome == 'failure' || steps.ingest.outcome == 'failure' }}
        run: |
          echo "::error::One or more source checks/ingestions failed; review coverage artifact."
          exit 1
