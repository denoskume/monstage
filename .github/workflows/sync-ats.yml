name: Refresh MonStage internship sources

on:
  schedule:
    # Hourly, 24/7. Scheduled GitHub runners can start late.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monstage-ats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_GATEWAY_SECRET: ${{ secrets.APPS_SCRIPT_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit official career portals in 10-of-30 rolling batches
        id: audit
        continue-on-error: true
        run: python scripts/audit_target_careers.py
      - name: Ingest Workday and Veolia SmartRecruiters jobs through runner
        id: ingest
        continue-on-error: true
        run: python scripts/ingest_public_ats.py
      - name: Verify ATS offers persisted without triggering a destructive second sync
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = os.getenv("APPS_SCRIPT_URL")
          secret = os.getenv("APPS_SCRIPT_GATEWAY_SECRET")
          if not endpoint or not secret:
              raise SystemExit("Missing Apps Script URL or gateway secret")
          data = json.dumps({
              "gatewaySecret": secret,
              "action": "offers",
          }).encode("utf-8")
          req = urllib.request.Request(endpoint, data, {
              "Content-Type": "application/json",
              "Accept": "application/json",
          }, method="POST")
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = json.load(response)
          if payload.get("source") != "Stage Intelligence France" or not isinstance(payload.get("offers"), list):
              raise SystemExit("Backend did not return the expected persisted offers")
          rows = payload["offers"]
          counts = {
              prefix: sum(str(row.get("id", "")).lower().startswith(prefix + ":") for row in rows)
              for prefix in ("workday", "smartrecruiters", "greenhouse", "ashby", "lever")
          }
          print("Persisted official ATS listings by provider:", json.dumps(counts))
          print("Total stored offers, including historical records:", len(rows))
          if counts["workday"] == 0 and counts["smartrecruiters"] == 0:
              raise SystemExit("ATS ingestion appears empty: no Workday or SmartRecruiters listings persisted")
          print("Backend read verified; no second provider refresh was run.")
          PY

      - name: Publish per-company A/B coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-career-coverage-${{ github.run_number }}
          path: |
            artifacts/career-source-coverage.json
            artifacts/career-source-coverage.md
            artifacts/career-jobboard-leads.json
          retention-days: 14
          if-no-files-found: warn

      - name: Fail visibly if source audit or ATS runner failed
        if: ${{ steps.audit.outcome == 'failure' || steps.ingest.outcome == 'failure' }}
        run: |
          echo "::error::One or more source checks/ingestions failed; review coverage artifact."
          exit 1
